name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore AppleCIDR/AppleCIDR.csproj

      - name: Publish win-x64 executable
        run: dotnet publish AppleCIDR/AppleCIDR.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Rename artifact
        shell: pwsh
        run: |
          Move-Item -Path publish/AppleCIDR.exe -Destination publish/AppleCIDR-win-x64.exe -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppleCIDR-win-x64
          path: publish/AppleCIDR-win-x64.exe

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/AppleCIDR-win-x64.exe
